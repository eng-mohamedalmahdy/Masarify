uri-kmp = { module = "com.eygraber:uri-kmp", version.ref = "uriKmp" }

[bundles]
koinCommon = [
    "koin-core",
    "koin-compose",
    "koin-composeVM"
]

okio = [
    "okio-core",
    "okio-node"
]

multiplatformSettings = [
    "multiplatform-settings",
    "multiplatform-settings-no-arg",
    "multiplatform-settings-serialization"
]
coil = [
    "coil-compose",
    "coil-network-ktor"
]

material3Adaptive = [
    "material3-adaptive",
    "material3-adaptive-layout",
    "material3-adaptive-navigation",
    "material3-adaptive-navigation-suite",
    "material3-adaptive-navigation3"
]

navigation3 = [
    "navigation3-ui",
    "lifecycle-viewmodel-navigation3"
]

ktor = [
    "ktor-client-core",
    "ktor-client-content-negotiation",
    "ktor-serialization-json"
]
filekit = [
    "filekit-core",
    "filekit-dialogs",
    "filekit-coil",
    "filekit-dialogs-compose"
]
[plugins]
